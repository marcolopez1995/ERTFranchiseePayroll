<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activate Crispy King Payroll</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff9ed;color:#421a1e;font:16px Arial}main{max-width:740px;margin:40px auto;padding:28px;background:white;border:1px solid #ebd9ce;border-radius:14px;border-top:8px solid #b21826}h1{font-size:28px}h2{font-size:20px}p{line-height:1.6}textarea{width:100%;font:14px monospace;padding:12px;min-height:90px;border:1px solid #c9aaa0;border-radius:6px}button,a.button{display:inline-block;background:#b21826;color:white;border:0;border-radius:6px;padding:12px 18px;font:inherit;cursor:pointer;margin:10px 6px 10px 0;text-decoration:none}#status{color:#b21826}.device{word-break:break-all;background:#fff1c9;padding:14px;user-select:all}
</style></head><body><main><h1>Crispy King Franchise Payroll System</h1><h2>Activate this computer</h2><p>Send your supplier this device code and your business name. Your supplier will issue a license file for this computer.</p><div class="device" id="device">Loading device code…</div><p><label for="license">Choose the license file supplied to you</label></p><input type="file" id="license" accept=".cklicense,.json"><p>Or paste its complete contents below.</p><textarea id="text" aria-label="License contents"></textarea><button id="activate">Activate payroll</button><a href="/manage">Backup and product details</a><p id="status" role="status"></p></main><script src="/support.js"></script><script>
const get=id=>document.getElementById(id);productRequest('/product').then(p=>{get('device').textContent=p.deviceId;get('status').textContent=p.error||'Already activated.';}).catch(e=>get('status').textContent=e.message);
get('license').onchange=async()=>{const f=get('license').files[0];if(f){if(f.size>30000){get('status').textContent='License file is too large.';return;}get('text').value=await f.text();}};
get('activate').onclick=async()=>{try{await productRequest('/activate',JSON.parse(get('text').value));location.href='/';}catch(e){get('status').textContent=e.message;}};
</script></body></html>
